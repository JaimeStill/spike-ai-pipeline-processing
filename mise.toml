# mise: the toolchain and the check, currency, and integration tasks.
[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
jq = "1.8.2"
shellcheck = "0.11.0"
# office, from its GitHub release, for the office package's tests that run the real binary; mise
# checks the archive against the release's digest.
"github:JaimeStill/spike-ai-pipeline-office" = "0.1.0"
# mail, from its GitHub release, for the email package's tests that run the real binary; mise
# checks the archive against the release's digest.
"github:JaimeStill/spike-ai-pipeline-mail" = "0.3.1"
# onenote, from its GitHub release, for the onenote package's tests that run the real binary;
# mise checks the archive against the release's digest.
"github:JaimeStill/spike-ai-pipeline-onenote" = "0.1.0"
# 7-Zip's 7zz, from its GitHub release, for the sevenzip package and the archive stage's 7z, zstd,
# cabinet, and other ZIP methods; mise checks the archive against the release's digest.
"github:ip7z/7zip" = { version = "26.05", asset_pattern = "7z*-linux-x64.tar.xz" }

[env]
# The repository's Go modules, as directories; tasks run in each one.
GO_MODULES = "."
# gb10-2's llama.cpp router, serving set A, named by its MagicDNS short name, for the tests that
# call a model: the bake-off and the integration tier's vision tests read it. A shell may point it
# elsewhere.
SPIKE_ROUTER_URL = "{{ get_env(name='SPIKE_ROUTER_URL', default='http://gb10-2:8080') }}"

[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module and script; writes nothing"
run = '''
set -eu
export GOWORK=off
cd "$MISE_PROJECT_ROOT"
git ls-files -z '*.sh' | xargs -0 -r shellcheck
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
  golangci-lint run --build-tags integration ./...
  golangci-lint run --build-tags bakeoff ./...
  golangci-lint run --build-tags findings ./...
done
'''

# The integration tier runs the integration-tagged tests on this machine: real ffmpeg, ffprobe, gs,
# and magick on PATH, the office, mail, onenote, and 7zz binaries mise pins, a reachable docker
# daemon, which pulls the pinned ffmpeg and LibreOffice images when they aren't present, and, for
# the vision tests, the router SPIKE_ROUTER_URL names. It never starts a server.
[tasks.integration]
description = "Run the integration-tagged tests against this machine's tools and docker, and the router"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  (cd "$MISE_PROJECT_ROOT/$mod" && go test -race -tags integration -count=1 ./...)
done
'''

[tasks.currency]
description = "Report every requirement, Go version, and tool behind its latest; writes nothing"
run = "scripts/currency.sh"

# The email package's copy of mail's fixtures and goldens, refreshed from mail's tag on the remote;
# it reports any drift against the copy's manifest. The check never fetches: it verifies the copy
# against the manifest offline.
[tasks."fixtures:mail"]
description = "Refresh email's copy of mail's fixtures from mail's tag; reports drift against the manifest"
run = "scripts/fixtures-mail.sh"

# The onenote package's copy of onenote's fixtures and expectations, refreshed from onenote's tag
# on the remote; it reports any drift against the copy's manifest. The check never fetches: it
# verifies the copy against the manifest offline.
[tasks."fixtures:onenote"]
description = "Refresh onenote's copy of onenote's fixtures from onenote's tag; reports drift against the manifest"
run = "scripts/fixtures-onenote.sh"

# The audio package's speech fixture, rebuilt from the LibriSpeech utterances in the test corpus
# at ~/docs (DOCS names another root) through the host's ffmpeg, each source checked by its
# SHA-256 and each output against the testdata README's. The check never runs it, and reads the
# committed fixture.
[tasks."fixtures:audio"]
description = "Rebuild audio's speech fixture from ~/docs' LibriSpeech utterances; checks sources and outputs by SHA-256"
run = "scripts/fixtures-audio.sh"

# The streams fixtures in audio/testdata, rebuilt from audio's committed speech fixture through the
# host's ffmpeg: an audio-and-video fixture of the speech beside a generated test pattern with known
# scene cuts, and two level-change variants of the speech, a gain step and added noise, with their
# truth. Each source and output is checked against the testdata README's SHA-256, and the cuts and
# fixed-threshold silences against the truth. The check never runs it, and reads the committed
# fixtures.
[tasks."fixtures:streams"]
description = "Rebuild the streams fixtures from audio's speech fixture; checks sources and outputs by SHA-256"
run = "scripts/fixtures-streams.sh"

# The email package's built .msg, rebuilt by mail's fixtures generator at its tag from an .eml
# source that attaches this repository's own office fixtures. It needs network access and installs
# .NET through mise; the check never runs it, and reads the committed .msg and its MANIFEST.
[tasks."fixtures:built"]
description = "Rebuild email's built .msg with mail's fixtures generator from its .eml source; needs .NET and network"
run = "scripts/fixtures-built.sh"

# The bake-off tier runs the bakeoff-tagged tests in package document: five PDF renderers on this
# machine's poppler, ghostscript, libvips, and ImageMagick, each page sent to Gemma 4 26B-A4B on
# the router SPIKE_ROUTER_URL names. The full matrix runs far longer than one 10-minute go test
# run, and one renderer's three sets longer too, so each renderer and fixture set is a run of its
# own, capped at 10 minutes, and a last run ranks their results, which a temporary directory
# carries between the runs. -v keeps the recorded lines. It isn't CI.
[tasks.bakeoff]
description = "Run the renderer bake-off against the router SPIKE_ROUTER_URL names; logs recorded lines"
run = '''
set -eu
export GOWORK=off
cd "$MISE_PROJECT_ROOT"
# A BAKEOFF_RESULTS the shell sets keeps the runs' results, transcriptions included, there.
if [ -z "${BAKEOFF_RESULTS:-}" ]; then
  BAKEOFF_RESULTS=$(mktemp -d)
  trap 'rm -rf "$BAKEOFF_RESULTS"' EXIT
fi
export BAKEOFF_RESULTS
# A failed run doesn't stop the others; the task fails at the end.
failed=0
for renderer in pdftoppm pdftocairo gs vips magick; do
  for set in clean degraded scanned; do
    start=$(date +%s)
    BAKEOFF_RENDERER=$renderer BAKEOFF_SET=$set \
      go test -tags bakeoff -count=1 -timeout 10m -v -run '^TestBakeoff$' ./document/ || failed=1
    echo "bakeoff: $renderer $set took $(( $(date +%s) - start )) s"
  done
done
go test -tags bakeoff -count=1 -timeout 10m -v -run '^TestBakeoffRanking$' ./document/ || failed=1
exit "$failed"
'''

# Evidence 11, the corrections matrix, in the bake-off tier: the degraded and scanned sets through
# Vision.Pages with the released renderer, gs, and the corrections stage on this machine's magick,
# each page sent to Gemma 4 26B-A4B on the router SPIKE_ROUTER_URL names, in seven cells (none,
# each correction alone, all five), three runs each, at 150 dpi and again at 72. A task of its own,
# so rerunning the matrix doesn't rerun the renderer bake-off. Each DPI, set, and cell is a run of
# its own, capped at 10 minutes, and a last run reports the matrix from their results, which a
# temporary directory carries between the runs. -v keeps the recorded lines. It isn't CI.
[tasks.bakeoff-corrections]
description = "Run the corrections matrix against the router SPIKE_ROUTER_URL names; logs recorded lines"
run = '''
set -eu
export GOWORK=off
cd "$MISE_PROJECT_ROOT"
# A BAKEOFF_RESULTS the shell sets keeps the runs' results, transcriptions included, there.
if [ -z "${BAKEOFF_RESULTS:-}" ]; then
  BAKEOFF_RESULTS=$(mktemp -d)
  trap 'rm -rf "$BAKEOFF_RESULTS"' EXIT
fi
export BAKEOFF_RESULTS
# A failed run doesn't stop the others; the task fails at the end.
failed=0
for dpi in 150 72; do
  for set in degraded scanned; do
    for cell in none Deskew Despeckle ContrastStretch Unsharp Grayscale all; do
      start=$(date +%s)
      BAKEOFF_DPI=$dpi BAKEOFF_SET=$set BAKEOFF_CELL=$cell \
        go test -tags bakeoff -count=1 -timeout 10m -v -run '^TestCorrections$' ./document/ || failed=1
      echo "bakeoff-corrections: $dpi dpi $set $cell took $(( $(date +%s) - start )) s"
    done
  done
done
go test -tags bakeoff -count=1 -timeout 10m -v -run '^TestCorrectionsMatrix$' ./document/ || failed=1
exit "$failed"
'''

# Ruling L of task documents, instruction placement, in the bake-off tier: the clean, degraded, and
# scanned sets through the vision harness with the released renderer at 150 dpi and no correction,
# each page sent to Gemma 4 26B-A4B on the router SPIKE_ROUTER_URL names, three runs each, with the
# transcription instructions beside the image in its user message and in the request's
# Instructions. Each placement and set is a run of its own, capped at 10 minutes, and a last run
# reports them from their results, which a temporary directory carries between the runs. -v keeps
# the recorded lines. It isn't CI.
[tasks.bakeoff-placement]
description = "Run the instruction placement comparison against the router SPIKE_ROUTER_URL names; logs recorded lines"
run = '''
set -eu
export GOWORK=off
cd "$MISE_PROJECT_ROOT"
# A BAKEOFF_RESULTS the shell sets keeps the runs' results, transcriptions included, there.
if [ -z "${BAKEOFF_RESULTS:-}" ]; then
  BAKEOFF_RESULTS=$(mktemp -d)
  trap 'rm -rf "$BAKEOFF_RESULTS"' EXIT
fi
export BAKEOFF_RESULTS
# A failed run doesn't stop the others; the task fails at the end.
failed=0
for placement in beside instructions; do
  for set in clean degraded scanned; do
    start=$(date +%s)
    BAKEOFF_PLACEMENT=$placement BAKEOFF_SET=$set \
      go test -tags bakeoff -count=1 -timeout 10m -v -run '^TestPlacement$' ./document/ || failed=1
    echo "bakeoff-placement: $placement $set took $(( $(date +%s) - start )) s"
  done
done
go test -tags bakeoff -count=1 -timeout 10m -v -run '^TestPlacementReport$' ./document/ || failed=1
exit "$failed"
'''

# Ruling N of task documents, the staged flow the inference layer will follow, in the bake-off
# tier: text layer first, vision only for the pages without one; Assess and a first pass that
# returns the transcription, a judgement, and corrections from the catalog under a strict schema;
# a second pass, corrected, only for the pages the first flagged; and the scanned pages' header and
# footer bands at 300 dpi. Each set is run as the flow and as two baselines, none and all-five,
# three runs each, each page sent to Gemma 4 26B-A4B on the router SPIKE_ROUTER_URL names with the
# released renderer and this machine's magick. Each set, variant, and run is a run of its own,
# capped at 10 minutes, and a last run reports them from their results, which a temporary
# directory carries between the runs. -v keeps the recorded lines. It isn't CI.
[tasks.bakeoff-flow]
description = "Run the staged two-pass flow against the router SPIKE_ROUTER_URL names; logs recorded lines"
run = '''
set -eu
export GOWORK=off
cd "$MISE_PROJECT_ROOT"
# A BAKEOFF_RESULTS the shell sets keeps the runs' results, transcriptions included, there.
if [ -z "${BAKEOFF_RESULTS:-}" ]; then
  BAKEOFF_RESULTS=$(mktemp -d)
  trap 'rm -rf "$BAKEOFF_RESULTS"' EXIT
fi
export BAKEOFF_RESULTS
# A failed run doesn't stop the others; the task fails at the end.
failed=0
flow() {
  start=$(date +%s)
  BAKEOFF_SET=$1 BAKEOFF_VARIANT=$2 BAKEOFF_RUN=$3 \
    go test -tags bakeoff -count=1 -timeout 10m -v -run '^TestFlow$' ./document/ || failed=1
  echo "bakeoff-flow: $1 $2 run $3 took $(( $(date +%s) - start )) s"
}
for set in clean degraded scanned; do
  for variant in flow none all-five; do
    for run in 1 2 3; do flow "$set" "$variant" "$run"; done
  done
done
for run in 1 2 3; do flow scanned regions "$run"; done
go test -tags bakeoff -count=1 -timeout 10m -v -run '^TestFlowReport$' ./document/ || failed=1
exit "$failed"
'''

# Ruling O of task documents, tile shape, in the bake-off tier: near-square tiles of the scanned
# set's pages 5 and 7, and page 7's full-width footer band, rendered by RenderRegion at 300 and
# 200 dpi, each sent three times to Gemma 4 26B-A4B on the router SPIKE_ROUTER_URL names with the
# plain transcription request beside it; each tile's image tokens and verbatim reads are logged.
# Each DPI is a run of its own, capped at 10 minutes. -v keeps the recorded lines. It isn't CI.
[tasks.bakeoff-tiles]
description = "Run the tile shape measurement against the router SPIKE_ROUTER_URL names; logs recorded lines"
run = '''
set -eu
export GOWORK=off
cd "$MISE_PROJECT_ROOT"
# A failed run doesn't stop the other; the task fails at the end.
failed=0
for dpi in 300 200; do
  start=$(date +%s)
  BAKEOFF_DPI=$dpi go test -tags bakeoff -count=1 -timeout 10m -v -run '^TestTiles$' ./document/ || failed=1
  echo "bakeoff-tiles: $dpi dpi took $(( $(date +%s) - start )) s"
done
exit "$failed"
'''

# Evidence 16's email finding, in the findings tier: the findings-tagged tests in package email
# thread and route every fixture and MIME input against the tests' hand truth, count plaso's 59 MB
# store's threads and routes, and time the adapter, threads included, and mail alone on plaso's
# store, the scale store EMAIL_SCALE_STORE names, and the scale mboxrd EMAIL_SCALE_MBOX names, with
# their peak memory. plaso's store is fetched into .state/ and checked by its SHA-256; none is
# committed. An EMAIL_FINDINGS_RESULTS the shell sets keeps the run's results there; unset, the
# run keeps nothing. It isn't CI.
[tasks.findings-email]
description = "Run the email finding on the fixtures and MIME inputs, plaso's store, the EMAIL_SCALE_STORE scale store, and the EMAIL_SCALE_MBOX scale mboxrd; keeps results only in EMAIL_FINDINGS_RESULTS"
run = "scripts/findings-email.sh"

# Task onenote's finding, in the integration and findings tiers: the tier's routes against the
# hand truth and onenote's media routes; inspection over ~/docs; the page ink of
# handwriting_recognition.one to Gemma 4 26B-A4B on the router SPIKE_ROUTER_URL names, beside
# OneNote's own recognition; the onenote adapter beside the CLI on ONENOTE_LARGE's three large
# sections; and the dispatcher over the ONENOTE_SCALE_STORE scale store, resumed, and through the
# pool beside plaso's store, a byte copy of the scale store, and mail's fixtures, with their time,
# peak memory, and peak disk. None of the stores is committed. An ONENOTE_FINDINGS_RESULTS the shell
# sets keeps the run's results there; unset, the run keeps nothing. It isn't CI.
[tasks.findings-onenote]
description = "Run the onenote finding: routes, inspection, ink, the large sections, and the dispatcher over the ONENOTE_SCALE_STORE scale store; keeps results only in ONENOTE_FINDINGS_RESULTS"
run = "scripts/findings-onenote.sh"

# Evidence 5's audio finding, in the findings tier: the findings-tagged tests in package audio.
# Each long source in ~/docs (DOCS names another root), checked by its SHA-256 against the corpus
# manifest, is windowed at its silences, transcribed by Gemma 4 E4B on the router SPIKE_ROUTER_URL
# names, 4 windows at once, and joined; scored by normalized WER and seam edits; seam passed by
# gpt-oss-120b a few words at a time; and its first 10 minutes sent whole as one unsplit request
# beside the same excerpt windowed. AUDIO_FINDINGS_SOURCES and AUDIO_FINDINGS_RUNS (3) choose the
# sources and runs. None of the audio is committed. An AUDIO_FINDINGS_RESULTS the shell sets keeps
# the run's results there; unset, the run keeps nothing. It isn't CI.
[tasks.findings-audio]
description = "Run the audio finding on ~/docs' long sources against the router SPIKE_ROUTER_URL names; keeps results only in AUDIO_FINDINGS_RESULTS"
run = "scripts/findings-audio.sh"

# The noise-floor tracker's tuning, in the findings tier: TestFindingsFloor in package audio
# measures a grid of tracker settings, and silencedetect, over the level-change fixtures and
# ~/docs' long sources (DOCS names another root), unchanged and with a gain step or a noise floor
# added at 10 minutes, and logs each plan's windows cut at the limit. AUDIO_FLOOR_SOURCES chooses
# the sources. It calls no model, and keeps nothing.
[tasks.findings-floor]
description = "Run the tracker's tuning grid over the level-change fixtures and ~/docs' long sources; logs each setting's windows cut at the limit"
env = { AUDIO_FLOOR_SOURCES = "{{ get_env(name='AUDIO_FLOOR_SOURCES', default='ami earnings21 earnings22') }}" }
run = "GOWORK=off go test -tags findings -count=1 -timeout 1h -v -run '^TestFindingsFloor$' ./audio/"

# Evidence 13's streams finding, in the findings tier: the findings-tagged tests in package media.
# Each source in ~/docs (DOCS names another root), checked by its SHA-256 against the corpus
# manifest, is read once unpaced with no model; its audio transcribed through audio's file path
# under silencedetect and the tracker; read at real time through media's paced stream, each window
# sent to Gemma 4 E4B and each frame to Gemma 4 26B-A4B on the router SPIKE_ROUTER_URL names as it
# arrives, each event's lags recorded and the transcript scored; and read at real time once more
# and cancelled midway. The paced runs take real time, about 75 minutes for the three sources.
# STREAMS_FINDINGS_SOURCES and STREAMS_FINDINGS_RUNS choose the sources and runs. None of the media
# is committed. A STREAMS_FINDINGS_RESULTS the shell sets keeps the run's results there; unset, the
# run keeps nothing. It isn't CI.
[tasks.findings-streams]
description = "Run the streams finding on ~/docs' videos at real time against the router SPIKE_ROUTER_URL names; keeps results only in STREAMS_FINDINGS_RESULTS"
run = "scripts/findings-streams.sh"
