<?xml version="1.0" encoding="UTF-8"?>
<!-- Security fixture: carries an inline script, an event handler, and an external reference.
     A safe pipeline extracts the text and never executes or fetches anything. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="120" onload="console.log('onload fired')">
  <script type="application/ecmascript">console.log('inline script executed');</script>
  <image x="0" y="0" width="1" height="1" xlink:href="http://example.invalid/tracker.png"/>
  <text x="20" y="60" font-family="sans-serif" font-size="20">Visible text: SAFE-SVG-MARKER</text>
</svg>
