<?xml version="1.0" encoding="UTF-8"?>
<!-- The picture package's own SVG fixture: shapes and text on no background, so a conversion
     flattens it onto white. 320x160 CSS pixels, 500x250 at 150 dpi. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160">
  <rect x="16" y="16" width="96" height="64" rx="6" fill="#1a73e8"/>
  <circle cx="176" cy="48" r="32" fill="#188038"/>
  <polygon points="240,80 272,16 304,80" fill="#e37400"/>
  <line x1="16" y1="104" x2="304" y2="104" stroke="#000000" stroke-width="2"/>
  <text x="160" y="140" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#000000">Picture fixture</text>
</svg>
